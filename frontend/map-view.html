<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WildShield AI | Map View</title>
    <meta name="description" content="Live wildlife intrusion map with zone markers and siren control." />
    <link rel="stylesheet" href="styles.css" />
    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV/XN2GqAQ=" crossorigin=""></script>
  </head>
  <body>
    <div class="app-shell">
      <div class="main-panel">

        <main class="dashboard-grid map-page-grid">
          <section class="glass-card panel-card map-hero-card">
            <div class="card-heading">
              <div>
                <p class="eyebrow">Interactive perimeter map</p>
                <h3>Wildlife intrusion path</h3>
              </div>
              <span class="status-pill danger" id="leafletStatusPill">Loading…</span>
            </div>

            <!-- Real Leaflet map -->
            <div id="leafletMap" class="leaflet-map-container" aria-label="Live zone map"></div>

            <!-- Tile error fallback message -->
            <p class="leaflet-tile-error" id="leafletTileError" style="display:none;">
              Map tiles unavailable — zone markers are still functional.
            </p>

            <div class="legend">
              <span><i class="legend-dot green"></i>Safe zone</span>
              <span><i class="legend-dot red"></i>At-risk zone</span>
              <span><i class="legend-dot orange"></i>Animal movement</span>
              <span><i class="legend-dot blue"></i>Camera</span>
            </div>

            <!-- Hidden compat elements for wireMapMarkers — populated by script.js -->
            <div style="display:none;" data-role="index-map-markers">
              <div class="map-marker village" data-role="map-village-1">Village 1<br/><small>SAFE</small></div>
              <div class="map-marker village" data-role="map-village-2">Village 2<br/><small>AT RISK</small></div>
              <div class="map-marker danger" data-role="map-siren-1">Siren 1<br/><small>OFF</small></div>
              <div class="map-marker safe" data-role="map-siren-2">Siren 2<br/><small>ON</small></div>
              <div class="map-marker animal" data-role="map-animal">🦁</div>
              <div data-role="map-camera"></div>
              <div data-role="map-sensor"></div>
              <div data-role="map-danger-zone"></div>
              <div data-role="map-safe-zone"></div>
            </div>
          </section>

          <aside class="glass-card panel-card info-card">
            <div class="card-heading">
              <div>
                <p class="eyebrow">Incident details</p>
                <h3>Threat Assessment</h3>
              </div>
            </div>
            <div class="info-list" data-role="map-threat"></div>
            <button class="btn btn-primary wide-btn" data-role="map-full-response-btn">ACTIVATE FULL RESPONSE</button>
          </aside>
        </main>
      </div>
    </div>

    <script src="layout.js"></script>
    <script src="api-service.js"></script>
    <script src="script.js"></script>
  </body>
</html>
