# Dataset config for YOLOv8 training (Ultralytics format).
# Matches the Colab/Roboflow wildlife dataset: 7 classes, same order.

path: ./data       # dataset root, relative to this file
train: train/images
val: val/images

nc: 7  # deer, elephant, human, leopard, lion, wild_boar, tiger
names:
  0: deer
  1: elephant
  2: human
  3: leopard
  4: lion
  5: wild_boar
  6: tiger
